<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#03010a" />
  <title>Vũ Trụ Tình Yêu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="universe" aria-label="Một trái tim bằng sao đang đập giữa thiên hà">
    <canvas id="galaxy" aria-hidden="true"></canvas>

    <section class="message" aria-live="polite">
      <p class="eyebrow">GIỮA HÀNG TỶ VÌ SAO</p>
      <h1>Anh vẫn tìm thấy <em>em</em></h1>
      <p class="subtitle">Mỗi nhịp đập là một lần vũ trụ nhắc anh rằng<br />tình yêu đẹp nhất đang ở ngay nơi này.</p>
      <button id="loveButton" type="button">
        <span class="button-heart" aria-hidden="true">♥</span>
        <span>Chạm vào trái tim</span>
      </button>
    </section>

    <div class="signature" aria-hidden="true">
      <span></span>
      <p>OUR UNIVERSE · FOREVER</p>
      <span></span>
    </div>

    <a class="admin-link" href="admin.html" aria-label="Mở trang quản trị lời nhắn">✦</a>
    <p class="hint">Kéo để xoay thiên hà · Chạm để gửi yêu thương</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
