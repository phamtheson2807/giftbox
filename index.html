<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#03010a" />
  <title>Vũ Trụ Tình Yêu</title>
  <link rel="stylesheet" href="styles.css?v=20260919-6" />
</head>
<body>
  <main class="universe" aria-label="Một trái tim bằng sao đang đập giữa thiên hà">
    <canvas id="galaxy" aria-hidden="true"></canvas>

    <div class="photo-reveal" id="photoReveal" aria-hidden="true">
      <div class="photo-burst" aria-hidden="true"></div>
      <figure class="love-photo">
        <img id="lovePhoto" alt="Kỷ niệm tình yêu" />
        <figcaption>Một khoảnh khắc của riêng chúng ta</figcaption>
      </figure>
      <button class="photo-close" id="photoClose" type="button" aria-label="Đóng ảnh">×</button>
    </div>

    <div class="signature" aria-hidden="true">
      <span></span>
      <p>OUR UNIVERSE · FOREVER</p>
      <span></span>
    </div>

    <a class="admin-link" href="admin.html" aria-label="Mở trang quản trị lời nhắn">✦</a>
    <p class="hint">Kéo để xoay thiên hà · Chạm để gửi yêu thương</p>
  </main>
  <script src="script.js?v=20260919-6"></script>
</body>
</html>
